name: All Tests

on:
  push:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

# CodeQL "Workflow does not contain permissions": restrict the GITHUB_TOKEN to
# the minimum. These jobs only read the repo -- checkout, conda/python setup,
# caching, and tests. Codecov uploads authenticate with CODECOV_TOKEN, not the
# GITHUB_TOKEN, so no write scope is needed.
permissions:
  contents: read

concurrency:
  # Keep push and pull_request runs separate so same-SHA PR updates do not inherit cancelled push checks.
  group: alltests-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  #============================================================
  # Feature branches: Linux only
  # Protected branches / PRs into develop or master: full 3-OS sweep
  #============================================================
  select-matrix:
    name: Select CI scope
    runs-on: ubuntu-latest
    outputs:
      os-matrix: ${{ steps.scope.outputs.os-matrix }}
      run-booktests: ${{ steps.scope.outputs.run-booktests }}
    steps:
      - name: Decide runner matrix and booktest scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}  # push: branch name; pull_request: <pr-number>/merge
          HEAD_REF: ${{ github.head_ref || github.ref_name }}  # source branch on both push and pull_request
          BASE_REF: ${{ github.base_ref }}
        run: |
          full_sweep=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full_sweep=true
          elif [[ "$REF_NAME" == *choi ]]; then
            full_sweep=true
          elif [[ "$EVENT_NAME" == "pull_request" && ( "$BASE_REF" == "develop" || "$BASE_REF" == "master" ) ]]; then
            full_sweep=true
          elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "master" ]]; then
            full_sweep=true
          fi

          if [[ "$full_sweep" == "true" ]]; then
            echo 'os-matrix=["windows-latest","macos-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'run-booktests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'os-matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'run-booktests=false' >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: select-matrix
    name: All Tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      RUN_BOOKTESTS: ${{ needs.select-matrix.outputs.run-booktests }}
    strategy:
        matrix:
            os: ${{ fromJSON(needs.select-matrix.outputs.os-matrix) }}
            python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          auto-activate-base: false
          # Name the env explicitly: without this the active environment is
          # ambiguous (base vs the auto-created `test`), which can leave pip
          # and python pointing at different prefixes.
          activate-environment: qmcpy-ci
          conda-remove-defaults: true

      # Without python-version above, matrix.python-version reached only the job
      # name and every job ran the conda base interpreter. Steps touching Python
      # must use a profile-loading shell (bash -el / pwsh) to see the env.
      - name: Verify interpreter matches the matrix (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: |
          echo "which python : $(which python)"
          echo "which pip    : $(which pip)"
          conda info --envs || true
          python -c "import sys; print('prefix:',sys.prefix); print(sys.version)"
          python -c "import sys; got='.'.join(map(str,sys.version_info[:2])); want='${{ matrix.python-version }}'; assert got==want, 'matrix says %s but interpreter is %s'%(want,got)"

      - name: Verify interpreter matches the matrix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command python | Format-List
          conda info --envs
          python -c "import sys; print('prefix:',sys.prefix); print(sys.version)"
          python -c "import sys; got='.'.join(map(str,sys.version_info[:2])); want='${{ matrix.python-version }}'; assert got==want, 'matrix says %s but interpreter is %s'%(want,got)"

      # -----------------------------------------------------------
      # Clean old coverage files
      # -----------------------------------------------------------
      - name: Remove old coverage data (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -f .coverage* coverage.json || true
      - name: Remove old coverage data (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Path .coverage* -Force -ErrorAction SilentlyContinue -Confirm:$false
          Remove-Item -Path coverage.json -Force -ErrorAction SilentlyContinue -Confirm:$false
      # -----------------------------------------------------------
      # Add 12GB swap, i.e., virtual memory (OS-specific)
      # -----------------------------------------------------------
      - name: Add 12GB swap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          echo "=== Existing swap devices ==="
          swapon --show || true

          current_swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
          if [ "${current_swap_mb:-0}" -ge 12000 ]; then
            echo "Sufficient swap already present (${current_swap_mb} MB). Skipping swap creation."
            free -h
            exit 0
          fi

          SWAPFILE=/tmp/qmcsoftware_swapfile

          if [ -f "$SWAPFILE" ]; then
            sudo swapoff "$SWAPFILE" || true
            sudo rm -f "$SWAPFILE"
          fi

          sudo fallocate -l 12G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "=== Swap after setup ==="
          swapon --show
          free -h

      - name: Add 12GB swap (macOS)
        if: runner.os == 'macOS'
        run: |
          # Create and mount a temporary swapfile
          sudo mkfile 12g /private/var/vm/tempswapfile
          sudo chmod 600 /private/var/vm/tempswapfile

      - name: Configure pagefile (Windows) via CIM (12GB)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $drive    = "D:"
          $initialMB = 12288
          $maxMB     = 12288
          $pagefile  = "$drive\pagefile.sys"
          Write-Host "Configuring pagefile: $pagefile (Initial=${initialMB}MB, Max=${maxMB}MB)"
          # Disable automatic management
          $cs = Get-CimInstance Win32_ComputerSystem
          if ($cs.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $false } | Out-Null
          }
          # Create or update the pagefile setting
          $escaped = $pagefile.Replace('\','\\')
          $pfs = Get-CimInstance Win32_PageFileSetting -Filter "Name='$escaped'" -ErrorAction SilentlyContinue
          if ($null -eq $pfs) {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{
              Name        = $pagefile
              InitialSize = $initialMB
              MaximumSize = $maxMB
            } | Out-Null
          } else {
            Set-CimInstance -InputObject $pfs -Property @{
              InitialSize = $initialMB
              MaximumSize = $maxMB
            } | Out-Null
          }
          "=== Pagefile settings ==="
          Get-CimInstance Win32_PageFileSetting | Format-Table Name,InitialSize,MaximumSize -Auto
      # -----------------------------------------------------------
      # Free disk + conda cache early (OS-specific)
      # -----------------------------------------------------------
      - name: Free space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          conda clean --all --yes
          pip cache purge || true
          df -h
      - name: Free space (macOS)
        if: runner.os == 'macOS'
        run: |
          conda clean --all --yes
          pip cache purge || true
          df -h
      - name: Free space (Windows)
        if: runner.os == 'Windows'
        run: |
          conda clean --all --yes || true
          pip cache purge || true
          Get-Volume | Select-Object DriveLetter, Size, SizeRemaining | Format-Table
      # -----------------------------------------------------------
      # Show resources (OS-specific)
      # -----------------------------------------------------------
      - name: Show runner resources
        if: runner.os != 'Windows'
        run: |
          echo "CPUs: $(nproc || sysctl -n hw.ncpu)"
          free -h || vm_stat
          df -h
      - name: Show runner resources
        if: runner.os == 'Windows'
        run: |
          # Check current pagefile settings
          Get-WmiObject Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize
          # Display system memory info
          Get-ComputerInfo -Property CsTotalPhysicalMemory
      # -----------------------------------------------------------
      # Install Python dependencies
      # -----------------------------------------------------------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pip/wheels
            ~/Library/Caches/pip
            ~/Library/Caches/pip/wheels
            ~\AppData\Local\pip\Cache
            ~\AppData\Local\pip\Cache\wheels
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache wheel files
        uses: actions/cache@v4
        with:
          path: ./.wheels
          key: ${{ runner.os }}-wheels-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-wheels-

      - name: Build and cache wheels (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          python -m pip wheel -w ./.wheels ".[test,test_torch,test_gpytorch,test_botorch,test_umbridge]" || true
      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          pip install --find-links ./.wheels -e ".[test,test_torch,test_gpytorch,test_botorch,test_umbridge]"
      - name: Build and cache wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          python -m pip wheel -w ./.wheels ".[test,test_torch,test_gpytorch,test_botorch]" || true
      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          pip install --find-links ./.wheels -e ".[test,test_torch,test_gpytorch,test_botorch]"
      - name: Build and cache wheels (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip wheel -w ./.wheels .[test,test_torch,test_gpytorch,test_botorch] || Write-Host 'wheel build step completed'
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install --find-links ./.wheels -e '.[test,test_torch,test_gpytorch,test_botorch]'
      - name: Install MPMC dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: qmcpy-install-mpmc

      - name: Install MPMC dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: qmcpy-install-mpmc

      - name: Validate MPMC dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: python -c "import torch, pyg_lib, torch_geometric; print(f'torch={torch.__version__}'); print('MPMC dependencies ready')"

      - name: Validate MPMC dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -c "import torch, pyg_lib, torch_geometric; print(f'torch={torch.__version__}'); print('MPMC dependencies ready')"
      # -----------------------------------------------------------
      # Colab readiness tests (Linux only)
      # -----------------------------------------------------------
      - name: Run Colab readiness tests (Linux)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          make check_colab_notebooks
          make check_colab_notebooks_smoke
      - name: Check test-suite conventions (Linux)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          set -e
          make check_test_style STRICT=--strict
          python -m pip install -q "pydoclint>=0.5.0"
          make check_docstring   # informational (exits 0 without STRICT)
      # -----------------------------------------------------------
      # Install minimal LaTeX required by Jupyter notebooks (OS-specific)
      # -----------------------------------------------------------
      - name: Install minimal LaTeX (Linux)
        if: runner.os == 'Linux' && env.RUN_BOOKTESTS == 'true'
        run: |
          sudo apt update
          sudo apt install -y texlive-latex-base texlive-latex-extra texlive-latex-recommended latexmk dvipng cm-super

      - name: Install minimal LaTeX (macOS)
        if: runner.os == 'macOS' && env.RUN_BOOKTESTS == 'true'
        run: |
          retry_cmd () {
            local max_attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed for: $*"
              echo "Retrying in 20s..."
              sleep 20
              attempt=$((attempt + 1))
            done
          }

          retry_cmd 3 brew install --cask basictex
          eval "$(/usr/libexec/path_helper)"
          # tlmgr re-resolves the CTAN redirector on every invocation, so a flaky/stale
          # mirror can be picked for one call even though a prior call succeeded.
          # Retry each tlmgr call so a bad mirror pick gets re-resolved on the next attempt.
          retry_cmd 3 sudo tlmgr update --self
          retry_cmd 3 sudo tlmgr install latexmk dvipng collection-fontsrecommended type1cm
      - name: Cache MiKTeX (Windows)
        id: cache-miktex
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\MiKTeX
            C:\ProgramData\MiKTeX
          key: ${{ runner.os }}-miktex-v2-${{ hashFiles('.github/workflows/alltests.yml') }}
          restore-keys: |
            ${{ runner.os }}-miktex-v2-

      - name: Install minimal LaTeX (Windows)
        if: runner.os == 'Windows' && env.RUN_BOOKTESTS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $MiKTeXBin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          $MiKTeXAdminData = "C:\ProgramData\MiKTeX"
          $HasExactMiKTeXCache = '${{ steps.cache-miktex.outputs.cache-hit }}' -eq 'true'

          function Invoke-WithRetry {
            param(
              [scriptblock]$Script,
              [string]$Description,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 20
            )
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              $global:LASTEXITCODE = 0
              try {
                & $Script
                if ($LASTEXITCODE -eq 0) {
                  return
                }
                throw "Exit code $LASTEXITCODE"
              } catch {
                if ($attempt -eq $MaxAttempts) {
                  throw "Command failed after $MaxAttempts attempts: $Description`n$($_.Exception.Message)"
                }
                Write-Host "Attempt $attempt/$MaxAttempts failed for: $Description"
                Write-Host $_.Exception.Message
                Write-Host "Retrying in $DelaySeconds seconds..."
                Start-Sleep -Seconds $DelaySeconds
              }
            }
          }

          $HasMiKTeXTree =
            (Test-Path (Join-Path $MiKTeXBin 'latex.exe')) -and
            (Test-Path (Join-Path $MiKTeXBin 'latexmk.exe')) -and
            (Test-Path (Join-Path $MiKTeXBin 'dvipng.exe')) -and
            (Test-Path $MiKTeXAdminData)
          $NeedsPackageBootstrap = (-not $HasExactMiKTeXCache) -or (-not $HasMiKTeXTree)

          if (-not $HasMiKTeXTree) {
            Invoke-WithRetry -Description "Install MiKTeX via Chocolatey" -Script {
              choco install miktex -y --no-progress --execution-timeout=1800
            }
          } else {
            Write-Host "Using cached MiKTeX installation."
          }

          if (-not (Get-Command perl.exe -ErrorAction SilentlyContinue)) {
            Invoke-WithRetry -Description "Install Strawberry Perl via Chocolatey" -Script {
              choco install strawberryperl -y --no-progress
            }
          }

          # Put MiKTeX on PATH for all subsequent steps
          echo $MiKTeXBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Refresh PATH in current session
          $env:PATH = "$MiKTeXBin;$env:PATH"

          if (-not (Test-Path (Join-Path $MiKTeXBin 'latex.exe'))) {
            throw "MiKTeX install did not produce latex.exe in $MiKTeXBin"
          }

          # Enable auto-install of missing packages (MiKTeX "just enough TeX" approach)
          Invoke-WithRetry -Description "Configure MiKTeX package auto-install" -Script {
            initexmf --admin --set-config-value [MPM]AutoInstall=1
          }

          if ($NeedsPackageBootstrap) {
            # Fresh or repaired installs need a package DB refresh before the binaries are safe to use.
            Invoke-WithRetry -Description "Refresh MiKTeX package database" -Script {
              mpm --admin --update-db
            }
            $packages = @('latexmk','dvipng','cm-super','lmodern','type1cm','tex-gyre','l3backend')
            foreach ($pkg in $packages) {
              Invoke-WithRetry -Description "Install MiKTeX package $pkg" -Script {
                mpm --admin --install=$pkg
              }
            }
          }

          Invoke-WithRetry -Description "Refresh MiKTeX filename database" -Script {
            initexmf --admin --update-fndb
          }
          $L3BackendPath = kpsewhich l3backend-dvips.def
          if ([string]::IsNullOrWhiteSpace($L3BackendPath)) {
            throw "MiKTeX install did not provide l3backend-dvips.def"
          }
          latex --version
          latexmk -v
          dvipng --version

      # -----------------------------------------------------------
      # Run doctests (OS-specific)
      # -----------------------------------------------------------
      - name: pip freeze (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: pip freeze

      - name: pip freeze (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pip freeze
      - name: doctests_minimal (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make doctests_minimal

      - name: doctests_minimal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make doctests_minimal
      - name: doctests_torch (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make doctests_torch

      - name: doctests_torch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make doctests_torch
      - name: doctests_gpytorch (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make doctests_gpytorch

      - name: doctests_gpytorch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make doctests_gpytorch
      - name: doctests_botorch (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make doctests_botorch

      - name: doctests_botorch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make doctests_botorch
      - name: doctests_markdown (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make doctests_markdown

      - name: doctests_markdown (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make doctests_markdown
      - name: Run umbridge doctests on Linux full sweeps when Docker is available
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" == "Linux" ] && [ "$RUN_BOOKTESTS" == "true" ] && command -v docker >/dev/null 2>&1; then
            make doctests_umbridge
          elif [ "$RUNNER_OS" != "Linux" ]; then
            echo "umbridge doctests only run on Linux"
          elif [ "$RUN_BOOKTESTS" != "true" ]; then
            echo "Skipping umbridge doctests outside full sweeps"
          else
            echo "Skipping umbridge doctests because Docker is not available on this runner"
          fi
      - name: Run MPMC doctests (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make doctests_mpmc

      - name: Run MPMC doctests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make doctests_mpmc
      # -----------------------------------------------------------
      # Run unittests for Python source files
      # -----------------------------------------------------------
      - name: Run unittests (parallel, Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make unittests

      - name: Run unittests (parallel, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make unittests

      # -----------------------------------------------------------
      # Upload doctest + unittest coverage BEFORE booktests wipe artifacts/
      # -----------------------------------------------------------
      - name: Upload pre-booktest coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: alltests
          fail_ci_if_error: false
          files: >-
            ./artifacts/coverage/unit/coverage.json,
            ./artifacts/coverage/doctests/minimal/coverage.json,
            ./artifacts/coverage/doctests/mpmc/coverage.json,
            ./artifacts/coverage/doctests/torch/coverage.json,
            ./artifacts/coverage/doctests/gpytorch/coverage.json,
            ./artifacts/coverage/doctests/botorch/coverage.json

      # -----------------------------------------------------------
      # Free disk + conda cache before booktests (OS-specific)
      # -----------------------------------------------------------
      - name: Free space (Linux)
        if: runner.os == 'Linux' && env.RUN_BOOKTESTS == 'true'
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          conda clean --all --yes
          pip cache purge || true
          df -h
      - name: Free space (macOS)
        if: runner.os == 'macOS' && env.RUN_BOOKTESTS == 'true'
        run: |
          conda clean --all --yes
          pip cache purge || true
          df -h
      - name: Free space (Windows)
        if: runner.os == 'Windows' && env.RUN_BOOKTESTS == 'true'
        run: |
          conda clean --all --yes || true
          pip cache purge || true
          Get-Volume | Select-Object DriveLetter, Size, SizeRemaining | Format-Table
      # -----------------------------------------------------------
      # Run unittests for Jupyter notebooks (OS-specific)
      # -----------------------------------------------------------
      - name: Run booktests (parallel) on Linux
        if: runner.os != 'Windows' && env.RUN_BOOKTESTS == 'true'
        shell: bash -l {0}
        run: |
          make booktests_parallel_no_docker    # Parsl not supported on Windows
      - name: Run booktests (parallel) on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Serial execution is slower but much more stable on Windows notebooks.
          make booktests_parallel_pytest PYTEST_XDIST="" PYTEST="-m 'not slow'"

      # -----------------------------------------------------------
      # Upload coverage to Codecov
      # -----------------------------------------------------------
      - name: Upload coverage to Codecov
        if: always() && env.RUN_BOOKTESTS == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: alltests
          fail_ci_if_error: false
          files: ./artifacts/coverage/booktests/coverage.json

# For success reports, see https://github.com/QMCSoftware/QMCSoftware/actions?query=is%3Asuccess+workflow%3AAll+Tests
